<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1724"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Sleek Modern "H" Monogram with Integrated Play Chevron -->
  <g filter="url(#neonGlow)">
    <!-- Left Column of H -->
    <rect x="112" y="96" width="76" height="320" rx="38" fill="url(#primaryGrad)"/>

    <!-- Right Column of H -->
    <rect x="324" y="96" width="76" height="320" rx="38" fill="url(#primaryGrad)"/>

    <!-- Dynamic Cinema Play Crossbar connecting the H -->
    <path d="M 160 220 L 330 256 L 160 292 Z" fill="url(#accentGrad)" fill-opacity="0.95"/>
    <rect x="150" y="228" width="212" height="56" rx="20" fill="url(#primaryGrad)"/>
    
    <!-- White Inner Play Triangle -->
    <polygon points="236,224 296,256 236,288" fill="#ffffff"/>
  </g>
</svg>
