<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131f"/>
      <stop offset="100%" stop-color="#03070d"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#20D66B"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with Subtle Neon Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Iconic Cinematic "H" Emblem -->
  <g filter="url(#glow)">
    <!-- Left Vertical Pillar of "H" with Film Notch details -->
    <rect x="110" y="106" width="68" height="300" rx="26" fill="url(#brandGrad)"/>
    
    <!-- Film Strip Perforations on Left Bar -->
    <rect x="126" y="140" width="16" height="24" rx="6" fill="#03070d" fill-opacity="0.8"/>
    <rect x="126" y="196" width="16" height="24" rx="6" fill="#03070d" fill-opacity="0.8"/>
    <rect x="126" y="292" width="16" height="24" rx="6" fill="#03070d" fill-opacity="0.8"/>
    <rect x="126" y="348" width="16" height="24" rx="6" fill="#03070d" fill-opacity="0.8"/>

    <!-- Right Vertical Pillar of "H" -->
    <rect x="334" y="106" width="68" height="300" rx="26" fill="url(#brandGrad)"/>

    <!-- Central Dynamic Play Arrow Bar uniting the "H" -->
    <path d="M 170 216 L 316 256 L 170 296 Z" fill="url(#glowGrad)"/>
    <rect x="160" y="234" width="190" height="44" rx="14" fill="url(#brandGrad)" fill-opacity="0.4"/>
    
    <!-- Crisp Inner Play Triangle in center of H -->
    <polygon points="230,214 304,256 230,298" fill="#ffffff" fill-opacity="0.95"/>
  </g>
</svg>
