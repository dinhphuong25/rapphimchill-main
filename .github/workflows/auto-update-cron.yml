name: Hi Phim Auto Update Cache

on:
  schedule:
    # Chạy mỗi 30 phút một lần (hoàn toàn miễn phí trên GitHub Actions, không cần Vercel Pro)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub bất cứ lúc nào

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Movie Update & Cache Revalidation
        run: |
          TARGET_URL="${{ secrets.WEBSITE_URL || 'https://hiphim.biz' }}"
          SECRET_TOKEN="${{ secrets.CRON_TOKEN || 'hiphim_secret_2026' }}"
          echo "Đang kích hoạt cập nhật cache tự động tới: $TARGET_URL"
          curl -f -s -m 30 "$TARGET_URL/api/cron/auto-update?token=$SECRET_TOKEN" || echo "Gửi yêu cầu hoàn tất."
