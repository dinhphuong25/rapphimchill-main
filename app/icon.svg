<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#04070c"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square with Gradient Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.35"/>
  
  <!-- Cinema Play/Clapper Icon -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Clapper Top Piece -->
    <path d="M 20 40 L 280 40 L 245 5 L 15 5 Z" fill="url(#brandGrad)"/>
    <!-- Stripes -->
    <path d="M 85 5 L 115 40 M 165 5 L 195 40" stroke="#04070c" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Main Clapper Box -->
    <rect x="15" y="55" width="265" height="195" rx="24" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="14"/>
    
    <!-- Neon Play Icon in Center -->
    <polygon points="120,110 190,152.5 120,195" fill="url(#brandGrad)"/>
  </g>
</svg>
