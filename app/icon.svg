<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hiPhimGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="playGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Frame -->
  <circle cx="256" cy="256" r="240" fill="url(#hiPhimGreen)" />
  
  <!-- Subtle Inner Border Highlight -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#bbf7d0" stroke-width="8" stroke-opacity="0.5" />
  
  <!-- Sleek Play Triangle with Smoothly Rounded Corners -->
  <path d="M 204 152 C 190 144 176 152 176 168 L 176 344 C 176 360 190 368 204 360 L 358 272 C 372 264 372 248 358 240 Z" 
        fill="url(#playGradient)" 
        filter="url(#playGlow)" />
</svg>